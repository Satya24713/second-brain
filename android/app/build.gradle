plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = file('../../.android-signing/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
  useLibrary 'android.test.runner'
  useLibrary 'android.test.base'
  namespace 'dev.satya.secondbrain'
  compileSdk 36
  defaultConfig {
    applicationId 'dev.satya.secondbrain'
    minSdk 24
    targetSdk 36
    versionCode 5
    versionName '1.2.0'
    testInstrumentationRunner 'android.test.InstrumentationTestRunner'
  }
  signingConfigs {
    release {
      storeFile file('../../.android-signing/second-brain.jks')
      storePassword signing.getProperty('password')
      keyAlias 'second-brain'
      keyPassword signing.getProperty('password')
    }
  }
  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
    }
    debug {
      signingConfig signingConfigs.release
    }
  }
}
configurations.configureEach {
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.webkit:webkit:1.12.1'
  implementation 'androidx.core:core:1.15.0'
}
