<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1560" role="img" aria-labelledby="title0 desc0" style="font-family:Arial,Helvetica,sans-serif"><title id="title0">A little more headspace.</title><desc id="desc0">The complete Second Brain app, in plain language. Start here, then follow the numbered pages.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6E887D"/></marker></defs><rect width="1600" height="1560" fill="#F7F8F4"/><text x="60" y="87" font-size="38" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="60" dy="0">A little more headspace.</tspan></text><text x="60" y="134" font-size="18" font-weight="400" fill="#526960" text-anchor="start"><tspan x="60" dy="0">The complete Second Brain app, in plain language. Start here, then follow the numbered pages.</tspan></text><text x="60" y="193" font-size="13" font-weight="600" fill="#5F7B70" text-anchor="start"><tspan x="60" dy="0">SECOND BRAIN / APP WALKTHROUGH / 01 OF 08</tspan></text><rect x="42" y="228" width="496" height="1292" rx="16" fill="#EAF0EB"/><text x="60" y="269" font-size="20" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="60" dy="0">01 / Open your space</tspan></text><rect x="552" y="228" width="496" height="1292" rx="16" fill="#EAF0EB"/><text x="570" y="269" font-size="20" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="570" dy="0">02 / Choose what you need</tspan></text><rect x="1062" y="228" width="496" height="1292" rx="16" fill="#EAF0EB"/><text x="1080" y="269" font-size="20" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="1080" dy="0">03 / Make it yours</tspan></text><path d="M290,454 V470 H290 V486" fill="none" stroke="#6E887D" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M290,644 V660 H290 V676" fill="none" stroke="#6E887D" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M290,834 V850 H290 V866" fill="none" stroke="#6E887D" stroke-width="1.5" marker-end="url(#arrow)"/><text x="297" y="843" font-size="12" font-weight="600" fill="#3A5B4D" text-anchor="start"><tspan x="297" dy="0">No</tspan></text><path d="M120,755 H48 V1135 H60" fill="none" stroke="#6E887D" stroke-width="1.5" marker-end="url(#arrow)"/><text x="43" y="945" font-size="12" font-weight="600" fill="#3A5B4D" text-anchor="end"><tspan x="43" dy="0">Yes</tspan></text><path d="M290,1024 V1040 H290 V1056" fill="none" stroke="#6E887D" stroke-width="1.5" marker-end="url(#arrow)"/><text x="297" y="1033" font-size="12" font-weight="600" fill="#3A5B4D" text-anchor="start"><tspan x="297" dy="0">After recovery</tspan></text><path d="M290,1214 V1230 H290 V1246" fill="none" stroke="#6E887D" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1310,454 V470 H1310 V486" fill="none" stroke="#6E887D" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1310,1024 V1040 H1310 V1056" fill="none" stroke="#6E887D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="296" width="460" height="158" rx="12" fill="#E7F3EB" stroke="#84AF96"/><text x="78" y="323" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="78" dy="0">Open Second Brain</tspan></text><text x="78" y="350" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="78" dy="0">Use the web app or the installed Android app. Your main</tspan><tspan x="78" dy="19">screen is Today.</tspan></text><rect x="60" y="486" width="460" height="158" rx="12" fill="#FFFFFF" stroke="#BBCDC5"/><text x="78" y="513" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="78" dy="0">Your workspace loads</tspan></text><text x="78" y="540" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="78" dy="0">See your saved tasks, journal, conversations and</tspan><tspan x="78" dy="19">check-ins.</tspan></text><polygon points="290,676 460,755 290,834 120,755" fill="#FFF1CD" stroke="#CEAE64"/><text x="290" y="734" font-size="17" font-weight="700" fill="#173E36" text-anchor="middle"><tspan x="290" dy="0">Did it load?</tspan></text><a href="#page-08"><rect x="60" y="866" width="460" height="158" rx="12" fill="#FCEDE9" stroke="#D2A69B"/><text x="78" y="893" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="78" dy="0">Something went wrong</tspan></text><text x="78" y="920" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="78" dy="0">Read the message, then choose Retry. Your saved work is</tspan><tspan x="78" dy="19">not intentionally cleared.</tspan></text><text x="78" y="1014" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="78" dy="0">OPEN PAGE 08 →</tspan></text></a><a href="#page-03"><rect x="60" y="1056" width="460" height="158" rx="12" fill="#E7EFED" stroke="#85A79A"/><text x="78" y="1083" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="78" dy="0">Today is your starting point</tspan></text><text x="78" y="1110" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="78" dy="0">Check today’s plan, older unfinished tasks, upcoming</tspan><tspan x="78" dy="19">events and gentle check-ins.</tspan></text><text x="78" y="1204" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="78" dy="0">OPEN PAGE 03 →</tspan></text></a><rect x="60" y="1246" width="460" height="158" rx="12" fill="#EDF1EF" stroke="#CCD6D0"/><text x="78" y="1273" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="78" dy="0">New here? Start small</tspan></text><text x="78" y="1300" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="78" dy="0">Add one task or open Settings to tell the app about</tspan><tspan x="78" dy="19">yourself. An empty space has helpful prompts.</tspan></text><a href="#page-02"><rect x="570" y="296" width="460" height="158" rx="12" fill="#E7EFED" stroke="#85A79A"/><text x="588" y="323" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="588" dy="0">02 · Tasks &amp; events</tspan></text><text x="588" y="350" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="588" dy="0">Capture something, set a date, edit the plan, complete</tspan><tspan x="588" dy="19">it or undo.</tspan></text><text x="588" y="444" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="588" dy="0">OPEN PAGE 02 →</tspan></text></a><a href="#page-03"><rect x="570" y="486" width="460" height="158" rx="12" fill="#E7EFED" stroke="#85A79A"/><text x="588" y="513" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="588" dy="0">03 · Today, Upcoming &amp; Find</tspan></text><text x="588" y="540" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="588" dy="0">Choose a view, filter your list, search tasks and see</tspan><tspan x="588" dy="19">what comes next.</tspan></text><text x="588" y="634" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="588" dy="0">OPEN PAGE 03 →</tspan></text></a><a href="#page-04"><rect x="570" y="676" width="460" height="158" rx="12" fill="#E7EFED" stroke="#85A79A"/><text x="588" y="703" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="588" dy="0">04 · Journal</tspan></text><text x="588" y="730" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="588" dy="0">Save a thought in your own words, edit it later or ask</tspan><tspan x="588" dy="19">for reflection.</tspan></text><text x="588" y="824" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="588" dy="0">OPEN PAGE 04 →</tspan></text></a><a href="#page-05"><rect x="570" y="866" width="460" height="158" rx="12" fill="#E7EFED" stroke="#85A79A"/><text x="588" y="893" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="588" dy="0">05 · Your second brain</tspan></text><text x="588" y="920" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="588" dy="0">Ask Gemini to help plan, clarify or break things into</tspan><tspan x="588" dy="19">manageable steps. Review proposed changes.</tspan></text><text x="588" y="1014" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="588" dy="0">OPEN PAGE 05 →</tspan></text></a><a href="#page-06"><rect x="570" y="1056" width="460" height="158" rx="12" fill="#E7EFED" stroke="#85A79A"/><text x="588" y="1083" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="588" dy="0">06 · Gentle nudges &amp; a fresh chat</tspan></text><text x="588" y="1110" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="588" dy="0">Follow up, see reminders while the app is open, or</tspan><tspan x="588" dy="19">clear the conversation.</tspan></text><text x="588" y="1204" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="588" dy="0">OPEN PAGE 06 →</tspan></text></a><rect x="570" y="1246" width="460" height="158" rx="12" fill="#EDF1EF" stroke="#CCD6D0"/><text x="588" y="1273" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="588" dy="0">Move between sections</tspan></text><text x="588" y="1300" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="588" dy="0">Desktop: sidebar. Mobile: bottom navigation and central</tspan><tspan x="588" dy="19">Add button. Search, AI and Settings stay within reach.</tspan></text><a href="#page-07"><rect x="1080" y="296" width="460" height="158" rx="12" fill="#E7EFED" stroke="#85A79A"/><text x="1098" y="323" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="1098" dy="0">07 · Personalize your space</tspan></text><text x="1098" y="350" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="1098" dy="0">Set your name, life context, goals and planning</tspan><tspan x="1098" dy="19">timezone.</tspan></text><text x="1098" y="444" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="1098" dy="0">OPEN PAGE 07 →</tspan></text></a><a href="#page-07"><rect x="1080" y="486" width="460" height="158" rx="12" fill="#F0ECF9" stroke="#B4A4D3"/><text x="1098" y="513" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="1098" dy="0">Connect Gemini in Settings</tspan></text><text x="1098" y="540" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="1098" dy="0">Enter your own API key inside the app. Everyday</tspan><tspan x="1098" dy="19">planning is available without it.</tspan></text><text x="1098" y="634" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="1098" dy="0">OPEN PAGE 07 →</tspan></text></a><a href="#page-08"><rect x="1080" y="676" width="460" height="158" rx="12" fill="#E7EFED" stroke="#85A79A"/><text x="1098" y="703" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="1098" dy="0">08 · Web or Android?</tspan></text><text x="1098" y="730" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="1098" dy="0">Web saves to your online account. Android saves to this</tspan><tspan x="1098" dy="19">phone. Their storage is separate.</tspan></text><text x="1098" y="824" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="1098" dy="0">OPEN PAGE 08 →</tspan></text></a><a href="#page-05"><rect x="1080" y="866" width="460" height="158" rx="12" fill="#E7F3EB" stroke="#84AF96"/><text x="1098" y="893" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="1098" dy="0">You decide what changes</tspan></text><text x="1098" y="920" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="1098" dy="0">AI replies can propose changes. They are saved to your</tspan><tspan x="1098" dy="19">workspace only when you apply them.</tspan></text><text x="1098" y="1014" font-size="11" font-weight="700" fill="#526960" text-anchor="start"><tspan x="1098" dy="0">OPEN PAGE 05 →</tspan></text></a><rect x="1080" y="1056" width="460" height="158" rx="12" fill="#E7F3EB" stroke="#84AF96"/><text x="1098" y="1083" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="1098" dy="0">Return to your saved work</tspan></text><text x="1098" y="1110" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="1098" dy="0">Tasks, thoughts, applied suggestions and conversations</tspan><tspan x="1098" dy="19">remain in their platform’s workspace.</tspan></text><rect x="1080" y="1246" width="460" height="158" rx="12" fill="#EDF1EF" stroke="#CCD6D0"/><text x="1098" y="1273" font-size="17" font-weight="700" fill="#173E36" text-anchor="start"><tspan x="1098" dy="0">How to read this map</tspan></text><text x="1098" y="1300" font-size="15" font-weight="400" fill="#344F43" text-anchor="start"><tspan x="1098" dy="0">Arrows show the next step. Gold diamonds are decisions.</tspan><tspan x="1098" dy="19">Purple boxes involve AI. Numbered cards open detail</tspan><tspan x="1098" dy="19">pages.</tspan></text><a href="#page-01"><text x="60" y="1540" font-size="14" font-weight="500" fill="#2B6752" text-anchor="start"><tspan x="60" dy="0">← Overview / choose another page</tspan></text></a><text x="1230" y="1540" font-size="13" font-weight="400" fill="#64796F" text-anchor="start"><tspan x="1230" dy="0">SECOND BRAIN  ·  01 / 08</tspan></text></svg>